<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tereré Mix - Cardápio completo. Encontre todos os sabores disponíveis.">
  <title>Tereré Mix - Cardápio</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Abas de categorias ── */
    .cat-tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--color-border, #e9ecef);
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }
    .cat-tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0;
      scroll-snap-align: start;
      padding: 12px 18px;
      border: none;
      background: none;
      font-size: .82rem;
      font-weight: 600;
      color: var(--color-gray-500, #6c757d);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .cat-tab.active {
      color: var(--color-primary, #0B3D2E);
      border-bottom-color: var(--color-primary, #0B3D2E);
    }

    /* ── Promoções Relâmpago ── */
    .promo-section {
      padding: var(--space-lg, 16px);
      background: linear-gradient(135deg, #fff9f0 0%, #fff3e0 100%);
      border-bottom: 1px solid #f0e0c0;
    }
    .promo-section__title {
      font-size: .9rem;
      font-weight: 700;
      color: #b45309;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .promo-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .promo-scroll::-webkit-scrollbar { display: none; }
    .promo-card {
      flex-shrink: 0;
      width: 200px;
      scroll-snap-align: start;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border: 1px solid #f0e0c0;
    }
    .promo-card__img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background: #f5f5f5;
    }
    .promo-card__body {
      padding: 10px 12px;
    }
    .promo-card__titulo {
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .promo-card__desc {
      font-size: .72rem;
      color: var(--color-gray-500);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .promo-card__precos {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .promo-card__de {
      font-size: .72rem;
      color: var(--color-gray-400, #adb5bd);
      text-decoration: line-through;
    }
    .promo-card__por {
      font-size: .9rem;
      font-weight: 800;
      color: #b45309;
    }
    .promo-card__btn {
      width: 100%;
      padding: 7px;
      background: #0B3D2E;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .promo-card__btn:active { opacity: .85; }

    /* ── Estoque esgotado ── */
    .menu-item--esgotado { opacity: .5; }
    .menu-item--esgotado .btn-add-cart { pointer-events: none; opacity: .4; }
    .badge-esgotado {
      display: inline-block; margin-left: 6px;
      font-size: .65rem; font-weight: 700;
      background: var(--color-danger, #e74c3c);
      color: #fff; padding: 1px 6px; border-radius: 4px;
      vertical-align: middle;
    }

    /* ── Search highlight ── */
    .menu-item--hidden { display: none; }
    .search-empty {
      padding: 2rem; text-align: center;
      color: var(--color-gray-500); font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- ═══ Search Bar ═══ -->
    <div class="search-bar" id="search-bar">
      <div class="search-bar__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" class="search-bar__input" id="search-input"
             placeholder="O que você quer comprar hoje?" aria-label="Buscar produtos">
      <a href="index.html" class="search-bar__close" id="btn-close-search" aria-label="Fechar busca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>

    <!-- ═══ Promoções Relâmpago ═══ -->
    <div id="promo-section-wrapper" style="display:none;">
      <div class="promo-section">
        <div class="promo-section__title">⚡ Promoções Relâmpago</div>
        <div class="promo-scroll" id="promo-scroll"></div>
      </div>
    </div>

    <!-- ═══ Abas de Categorias ═══ -->
    <div class="cat-tabs-wrap" id="cat-tabs-wrap" style="display:none;">
      <div class="cat-tabs" id="cat-tabs"></div>
    </div>

    <!-- ═══ Cardápio (renderizado pela API) ═══ -->
    <div id="cardapio-wrapper">
      <div id="cardapio-skeleton" style="padding: 1rem;">
        <div class="skeleton" style="height:40px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:24px;"></div>
        <div class="skeleton" style="height:40px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;"></div>
      </div>
    </div>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal">
      <a href="index.html" class="bottom-nav__item" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Início</span>
      </a>
      <a href="pedidos.html" class="bottom-nav__item" id="nav-orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Pedidos</span>
      </a>
      <a href="carrinho.html" class="bottom-nav__item" id="nav-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" hidden>0</span>
        <span>Carrinho</span>
      </a>
    </nav>

  </div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/services.js"></script>
  <script>
    /* ============================================================
       Tereré Mix — cardapio.html
       Promoções relâmpago + Cardápio em abas + Busca
       ============================================================ */

    let _todosProdutos   = [];
    let _categoriaAtiva  = null;

    function fmtBRL(value) {
      return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    /* ── HTML de item do menu ── */
    function menuItemHTML(p) {
      const esgotado = p.estoque === 0;
      return `
        <article class="menu-item ${esgotado ? 'menu-item--esgotado' : ''}"
                 id="item-${p.id}"
                 data-product-id="${p.id}"
                 data-product-name="${p.nome}"
                 data-product-price="${p.preco}"
                 data-product-image="${p.imagem || ''}">
          <div class="menu-item__info">
            <p class="menu-item__name">${p.nome}${esgotado ? '<span class="badge-esgotado">Esgotado</span>' : ''}</p>
            ${p.descricao ? `<p class="menu-item__desc" style="font-size:.75rem;color:var(--color-gray-500);margin:2px 0;">${p.descricao}</p>` : ''}
            <p class="menu-item__price">${fmtBRL(p.preco)}</p>
          </div>
          <img src="${p.imagem || 'assets/images/terere-mix.png'}"
               alt="${p.nome}" class="menu-item__image"
               loading="lazy"
               style="object-fit:cover;">
          <button class="btn-add-cart" data-add-to-cart
                  aria-label="Adicionar ${p.nome}"
                  ${esgotado ? 'disabled' : ''}>+</button>
        </article>`;
    }

    /* ── Renderiza produtos da categoria ativa ── */
    function renderCategoria(categoriaName) {
      _categoriaAtiva = categoriaName;
      const wrapper = document.getElementById('cardapio-wrapper');
      const produtos = _todosProdutos.filter(p => p.categoria === categoriaName);

      if (!produtos.length) {
        wrapper.innerHTML = `<div class="search-empty"><p>Nenhum produto nesta categoria.</p></div>`;
        return;
      }

      wrapper.innerHTML = `
        <div class="menu-grid" id="menu-grid-ativo" style="padding-top:8px;">
          ${produtos.map(menuItemHTML).join('')}
        </div>`;

      Cart.bindProductButtons();
    }

    /* ── Renderiza abas de categorias ── */
    function renderTabs(categorias) {
      const tabsWrap = document.getElementById('cat-tabs-wrap');
      const tabs     = document.getElementById('cat-tabs');
      if (!tabs) return;

      tabsWrap.style.display = '';
      tabs.innerHTML = categorias.map((cat, i) => `
        <button class="cat-tab ${i === 0 ? 'active' : ''}"
                data-cat="${cat}" type="button">${cat}</button>
      `).join('');

      tabs.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCategoria(btn.dataset.cat);

          // Limpa busca ao trocar de aba
          const si = document.getElementById('search-input');
          if (si) si.value = '';
        });
      });

      // Rola a aba ativa para o centro
      const primeiraTab = tabs.querySelector('.cat-tab.active');
      if (primeiraTab) primeiraTab.scrollIntoView({ inline: 'center', behavior: 'smooth' });
    }

    /* ── Renderiza promoções ── */
    async function renderPromocoes(todosProdutos) {
      try {
        const promos = await API.getPromocoes();
        if (!promos || !promos.length) return;

        const wrapper = document.getElementById('promo-section-wrapper');
        const scroll  = document.getElementById('promo-scroll');
        wrapper.style.display = '';

        scroll.innerHTML = promos.map(pr => {
          const img     = pr.imagem || 'assets/images/terere-mix.png';
          const deLabel = pr.preco_original
            ? `<span class="promo-card__de">${fmtBRL(pr.preco_original)}</span>` : '';
          const temProduto = pr.produto_id != null;
          const produtoDB  = temProduto ? todosProdutos.find(p => p.id == pr.produto_id) : null;

          const btnAttr = produtoDB
            ? `data-product-id="${produtoDB.id}"
               data-product-name="${produtoDB.nome}"
               data-product-price="${produtoDB.preco}"
               data-product-image="${produtoDB.imagem || ''}"
               data-add-to-cart`
            : `disabled style="opacity:.5;cursor:default;" title="Disponível na loja"`;

          return `
            <div class="promo-card">
              <img src="${img}" alt="${pr.titulo}" class="promo-card__img" loading="lazy">
              <div class="promo-card__body">
                <p class="promo-card__titulo">${pr.titulo}</p>
                ${pr.descricao ? `<p class="promo-card__desc">${pr.descricao}</p>` : ''}
                <div class="promo-card__precos">
                  ${deLabel}
                  <span class="promo-card__por">${fmtBRL(pr.preco_promocional)}</span>
                </div>
                <button class="promo-card__btn" ${btnAttr}>
                  ${produtoDB ? 'Adicionar' : 'Na loja'}
                </button>
              </div>
            </div>`;
        }).join('');

        Cart.bindProductButtons();
      } catch { /* promoções são opcionais */ }
    }

    /* ── Renderização principal ── */
    async function renderCardapio() {
      const wrapper = document.getElementById('cardapio-wrapper');

      try {
        _todosProdutos = await API.getProdutos();

        // Agrupa categorias (excluindo Destaques)
        const categoriasMap = {};
        for (const p of _todosProdutos) {
          if (p.categoria === 'Destaques') continue;
          if (!categoriasMap[p.categoria]) categoriasMap[p.categoria] = [];
          categoriasMap[p.categoria].push(p);
        }

        const categorias = Object.keys(categoriasMap);

        if (!categorias.length) {
          wrapper.innerHTML = `<div class="search-empty" style="padding:3rem;"><p>Nenhum produto cadastrado no momento.</p></div>`;
          return;
        }

        // Monta abas
        renderTabs(categorias);

        // Renderiza primeira categoria
        renderCategoria(categorias[0]);

        // Carrega promoções em paralelo
        await renderPromocoes(_todosProdutos);

      } catch (err) {
        wrapper.innerHTML = `
          <div style="padding:2rem;text-align:center;">
            <p style="color:var(--color-danger,#e74c3c);font-weight:600;">Erro ao carregar cardápio</p>
            <p style="font-size:.85rem;color:var(--color-gray-500);margin-top:.5rem;">${err.message}</p>
          </div>`;
      }
    }

    /* ── Busca em tempo real ── */
    function initSearch() {
      const searchInput = document.getElementById('search-input');

      searchInput.addEventListener('input', () => {
        const query   = searchInput.value.toLowerCase().trim();
        const wrapper = document.getElementById('cardapio-wrapper');

        if (!query) {
          // Restaura a aba ativa
          renderCategoria(_categoriaAtiva || Object.keys(
            _todosProdutos.reduce((acc, p) => { if (p.categoria !== 'Destaques') acc[p.categoria] = true; return acc; }, {})
          )[0]);
          return;
        }

        // Busca em todos os produtos
        const encontrados = _todosProdutos.filter(p =>
          p.categoria !== 'Destaques' &&
          (p.nome.toLowerCase().includes(query) ||
           (p.descricao || '').toLowerCase().includes(query))
        );

        if (!encontrados.length) {
          wrapper.innerHTML = `<div class="search-empty">Nenhum produto encontrado para "<strong>${query}</strong>"</div>`;
          return;
        }

        wrapper.innerHTML = `
          <div class="menu-grid" style="padding-top:8px;">
            ${encontrados.map(menuItemHTML).join('')}
          </div>`;
        Cart.bindProductButtons();
      });
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCardapio();
      initSearch();
    });
  </script>
</body>
</html>
