<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tereré Mix - Cardápio completo. Encontre todos os sabores disponíveis.">
  <title>Tereré Mix - Cardápio</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Promoções Relâmpago ── */
    .promo-section {
      padding: var(--space-lg, 16px);
      background: linear-gradient(135deg, #fff9f0 0%, #fff3e0 100%);
      border-bottom: 1px solid #f0e0c0;
    }
    .promo-section__title {
      font-size: .9rem;
      font-weight: 700;
      color: #b45309;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .promo-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .promo-scroll::-webkit-scrollbar { display: none; }
    .promo-card {
      flex-shrink: 0;
      width: 200px;
      scroll-snap-align: start;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border: 1px solid #f0e0c0;
      display: flex;
      flex-direction: column;
    }
    .promo-card__img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background: #f5f5f5;
      flex-shrink: 0;
    }
    .promo-card__body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .promo-card__precos {
      margin-top: auto;
    }
    .promo-card__titulo {
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .promo-card__desc {
      font-size: .72rem;
      color: var(--color-gray-500);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .promo-card__precos {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .promo-card__de {
      font-size: .72rem;
      color: var(--color-gray-400, #adb5bd);
      text-decoration: line-through;
    }
    .promo-card__por {
      font-size: .9rem;
      font-weight: 800;
      color: #b45309;
    }
    .promo-card__btn {
      width: 100%;
      padding: 7px;
      background: #0B3D2E;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .promo-card__btn:active { opacity: .85; }

    /* ── Estoque esgotado ── */
    .menu-item--esgotado { opacity: .5; }
    .menu-item--esgotado .btn-add-cart { pointer-events: none; opacity: .4; }
    .badge-esgotado {
      display: inline-block; margin-left: 6px;
      font-size: .65rem; font-weight: 700;
      background: var(--color-danger, #e74c3c);
      color: #fff; padding: 1px 6px; border-radius: 4px;
      vertical-align: middle;
    }

    /* ── Search highlight ── */
    .menu-item--hidden { display: none; }
    .search-empty {
      padding: 2rem; text-align: center;
      color: var(--color-gray-500); font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- ═══ Search Bar ═══ -->
    <div class="search-bar" id="search-bar">
      <div class="search-bar__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" class="search-bar__input" id="search-input"
             placeholder="O que você quer comprar hoje?" aria-label="Buscar produtos">
      <a href="index.html" class="search-bar__close" id="btn-close-search" aria-label="Fechar busca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>

    <!-- ═══ Promoções Relâmpago ═══ -->
    <div id="promo-section-wrapper" style="display:none;">
      <div class="promo-section">
        <div class="promo-section__title">⚡ Promoções Relâmpago</div>
        <div class="promo-scroll" id="promo-scroll"></div>
      </div>
    </div>

    <!-- ═══ Abas de Categorias ═══ -->
    <div class="cat-tabs-wrap" id="cat-tabs-wrap" style="display:none;">
      <div class="cat-tabs" id="cat-tabs"></div>
    </div>

    <!-- ═══ Cardápio (renderizado pela API) ═══ -->
    <div id="cardapio-wrapper">
      <div id="cardapio-skeleton" style="padding: 1rem;">
        <div class="skeleton" style="height:40px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:24px;"></div>
        <div class="skeleton" style="height:40px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:80px;"></div>
      </div>
    </div>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal">
      <a href="index.html" class="bottom-nav__item" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Início</span>
      </a>
      <a href="pedidos.html" class="bottom-nav__item" id="nav-orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Pedidos</span>
      </a>
      <a href="carrinho.html" class="bottom-nav__item" id="nav-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" hidden>0</span>
        <span>Carrinho</span>
      </a>
    </nav>

  </div>

  <!-- ═══ Modal Produto ═══ -->
  <div id="pm-overlay" class="pm-overlay" role="dialog" aria-modal="true" aria-label="Detalhes do produto">
    <div class="pm-modal">
      <button class="pm-close" id="pm-close" aria-label="Fechar">✕</button>
      <img id="pm-img" src="" alt="" class="pm-img">
      <div class="pm-body">
        <h2 class="pm-name" id="pm-name"></h2>
        <p class="pm-desc" id="pm-desc"></p>
        <p class="pm-price" id="pm-price"></p>
        <textarea class="pm-obs" id="pm-obs" rows="2" placeholder="Alguma observação? (ex: sem açúcar)"></textarea>
        <div class="pm-footer">
          <div class="pm-qty-ctrl">
            <button class="pm-qty-btn" id="pm-minus" aria-label="Diminuir">−</button>
            <span class="pm-qty-num" id="pm-qty">1</span>
            <button class="pm-qty-btn" id="pm-plus" aria-label="Aumentar">+</button>
          </div>
          <button class="pm-add-btn" id="pm-add">Adicionar ao carrinho</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Botão Instagram Flutuante ═══ -->
  <a id="ig-float-btn" href="#" target="_blank" rel="noopener noreferrer"
     class="ig-float-btn" aria-label="Siga-nos no Instagram" style="display:none;">

    </svg>
  </a>

  <!-- ═══ Botão WhatsApp Flutuante ═══ -->
  <a id="wpp-float-btn" href="#" target="_blank" rel="noopener noreferrer"
     class="wpp-float-btn" aria-label="Fale conosco no WhatsApp" style="display:none;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

  <style>
    /* ── Product Modal ── */
    .pm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 500;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
    }
    .pm-overlay.open { opacity: 1; pointer-events: all; }
    .pm-modal {
      background: #fff; border-radius: 20px;
      width: 100%; max-width: 340px;
      overflow: hidden; position: relative;
      transform: translateY(18px) scale(.96);
      transition: transform .26s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 24px 64px rgba(0,0,0,.28);
    }
    .pm-overlay.open .pm-modal { transform: translateY(0) scale(1); }
    .pm-close {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(0,0,0,.35); border: none; color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      font-size: .8rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s;
    }
    .pm-close:hover { background: rgba(0,0,0,.55); }
    .pm-img { width: 100%; height: 190px; object-fit: cover; display: block; background: #f5f5f5; }
    .pm-body { padding: 14px 18px 18px; }
    .pm-name { font-size: 1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; line-height: 1.3; }
    .pm-desc { font-size: .78rem; color: #6c757d; margin-bottom: 6px; line-height: 1.4; }
    .pm-price { font-size: 1.15rem; font-weight: 800; color: #0B3D2E; margin-bottom: 10px; }
    .pm-obs {
      width: 100%; border: 1.5px solid #e9ecef; border-radius: 10px;
      padding: 8px 11px; font-size: .8rem; font-family: inherit;
      resize: none; color: #333; background: #f8f9fa;
      margin-bottom: 12px; display: block; transition: border-color .2s;
    }
    .pm-obs:focus { outline: none; border-color: #0B3D2E; }
    .pm-footer { display: flex; align-items: center; gap: 10px; }
    .pm-qty-ctrl {
      display: flex; align-items: center;
      background: #f1f3f5; border-radius: 10px; padding: 3px 5px;
      gap: 4px; flex-shrink: 0;
    }
    .pm-qty-btn {
      width: 30px; height: 30px; border-radius: 7px; border: none;
      background: #fff; color: #0B3D2E; font-size: 1.1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.1);
      transition: background .15s; line-height: 1;
    }
    .pm-qty-btn:active { background: #e9ecef; }
    .pm-qty-num { min-width: 24px; text-align: center; font-size: .95rem; font-weight: 700; color: #1a1a1a; }
    .pm-add-btn {
      flex: 1; background: #0B3D2E; color: #fff; border: none;
      border-radius: 10px; padding: 12px;
      font-size: .88rem; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background .2s, transform .1s;
    }
    .pm-add-btn:active { background: #0a3328; transform: scale(.98); }

    /* ── WhatsApp Float ── */
    .wpp-float-btn {
      position: fixed; bottom: 80px; right: 16px; z-index: 400;
      width: 52px; height: 52px; border-radius: 50%;
      background: #25D366;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(37,211,102,.45);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .wpp-float-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px rgba(37,211,102,.6);
    }

    /* ── Instagram Float ── */
    .ig-float-btn {
      position: fixed; bottom: 142px; right: 16px; z-index: 400;
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(188,24,136,.35);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .ig-float-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(188,24,136,.5);
    }
  </style>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/services.js"></script>
  <script>
    /* ============================================================
       Tereré Mix — cardapio.html
       Promoções relâmpago + Cardápio em abas + Busca
       ============================================================ */

    let _todosProdutos   = [];
    let _categoriaAtiva  = null;

    function fmtBRL(value) {
      return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    /* ── HTML de item do menu ── */
    function menuItemHTML(p) {
      const esgotado = p.estoque === 0;
      return `
        <article class="menu-item ${esgotado ? 'menu-item--esgotado' : ''}"
                 id="item-${p.id}"
                 data-product-id="${p.id}"
                 data-product-name="${p.nome}"
                 data-product-price="${p.preco}"
                 data-product-image="${p.imagem || ''}"
                 data-product-desc="${p.descricao || ''}">
          <div class="menu-item__info">
            <p class="menu-item__name">${p.nome}${esgotado ? '<span class="badge-esgotado">Esgotado</span>' : ''}</p>
            ${p.descricao ? `<p class="menu-item__desc" style="font-size:.75rem;color:var(--color-gray-500);margin:2px 0;">${p.descricao}</p>` : ''}
            <p class="menu-item__price">${fmtBRL(p.preco)}</p>
          </div>
          <img src="${p.imagem || 'assets/images/terere-mix.png'}"
               alt="${p.nome}" class="menu-item__image"
               loading="lazy"
               style="object-fit:cover;">
          <button class="btn-add-cart" data-add-to-cart
                  aria-label="Adicionar ${p.nome}"
                  ${esgotado ? 'disabled' : ''}>+</button>
        </article>`;
    }

    /* ── Renderiza produtos da categoria ativa ── */
    function renderCategoria(categoriaName) {
      _categoriaAtiva = categoriaName;
      const wrapper = document.getElementById('cardapio-wrapper');
      const produtos = _todosProdutos.filter(p => p.categoria === categoriaName);

      if (!produtos.length) {
        wrapper.innerHTML = `<div class="search-empty"><p>Nenhum produto nesta categoria.</p></div>`;
        return;
      }

      wrapper.innerHTML = `
        <div class="menu-grid" id="menu-grid-ativo" style="padding-top:8px;">
          ${produtos.map(menuItemHTML).join('')}
        </div>`;

      Cart.bindProductButtons();
    }

    /* ── Renderiza abas de categorias ── */
    function renderTabs(categorias) {
      const tabsWrap = document.getElementById('cat-tabs-wrap');
      const tabs     = document.getElementById('cat-tabs');
      if (!tabs) return;

      tabsWrap.style.display = '';
      tabs.innerHTML = categorias.map((cat, i) => `
        <button class="cat-tab ${i === 0 ? 'active' : ''}"
                data-cat="${cat}" type="button">${cat}</button>
      `).join('');

      tabs.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCategoria(btn.dataset.cat);

          // Limpa busca ao trocar de aba
          const si = document.getElementById('search-input');
          if (si) si.value = '';
        });
      });

      // Rola a aba ativa para o centro
      const primeiraTab = tabs.querySelector('.cat-tab.active');
      if (primeiraTab) primeiraTab.scrollIntoView({ inline: 'center', behavior: 'smooth' });
    }

    /* ── Renderiza promoções ── */
    async function renderPromocoes(todosProdutos) {
      try {
        const promos = await API.getPromocoes();
        if (!promos || !promos.length) return;

        const wrapper = document.getElementById('promo-section-wrapper');
        const scroll  = document.getElementById('promo-scroll');
        wrapper.style.display = '';

        scroll.innerHTML = promos.map(pr => {
          const img     = pr.imagem || 'assets/images/terere-mix.png';
          const deLabel = pr.preco_original
            ? `<span class="promo-card__de">${fmtBRL(pr.preco_original)}</span>` : '';
          const temProduto = pr.produto_id != null;
          const produtoDB  = temProduto ? todosProdutos.find(p => p.id == pr.produto_id) : null;

          const btnAttr = produtoDB
            ? `data-product-id="${produtoDB.id}"
               data-product-name="${produtoDB.nome}"
               data-product-price="${produtoDB.preco}"
               data-product-image="${produtoDB.imagem || ''}"
               data-add-to-cart`
            : `disabled style="opacity:.5;cursor:default;" title="Disponível na loja"`;

          return `
            <div class="promo-card">
              <img src="${img}" alt="${pr.titulo}" class="promo-card__img" loading="lazy">
              <div class="promo-card__body">
                <p class="promo-card__titulo">${pr.titulo}</p>
                ${pr.descricao ? `<p class="promo-card__desc">${pr.descricao}</p>` : ''}
                <div class="promo-card__precos">
                  ${deLabel}
                  <span class="promo-card__por">${fmtBRL(pr.preco_promocional)}</span>
                </div>
                <button class="promo-card__btn" ${btnAttr}>
                  ${produtoDB ? 'Adicionar' : 'Na loja'}
                </button>
              </div>
            </div>`;
        }).join('');

        Cart.bindProductButtons();
      } catch { /* promoções são opcionais */ }
    }

    /* ── Renderização principal ── */
    async function renderCardapio() {
      const wrapper = document.getElementById('cardapio-wrapper');

      try {
        _todosProdutos = await API.getProdutos();

        // Agrupa categorias (excluindo Destaques)
        const categoriasMap = {};
        for (const p of _todosProdutos) {
          if (p.categoria === 'Destaques') continue;
          if (!categoriasMap[p.categoria]) categoriasMap[p.categoria] = [];
          categoriasMap[p.categoria].push(p);
        }

        const categorias = Object.keys(categoriasMap);

        if (!categorias.length) {
          wrapper.innerHTML = `<div class="search-empty" style="padding:3rem;"><p>Nenhum produto cadastrado no momento.</p></div>`;
          return;
        }

        // Monta abas
        renderTabs(categorias);

        // Renderiza primeira categoria
        renderCategoria(categorias[0]);

        // Carrega promoções em paralelo
        await renderPromocoes(_todosProdutos);

      } catch (err) {
        wrapper.innerHTML = `
          <div style="padding:2rem;text-align:center;">
            <p style="color:var(--color-danger,#e74c3c);font-weight:600;">Erro ao carregar cardápio</p>
            <p style="font-size:.85rem;color:var(--color-gray-500);margin-top:.5rem;">${err.message}</p>
          </div>`;
      }
    }

    /* ── Busca em tempo real ── */
    function initSearch() {
      const searchInput = document.getElementById('search-input');

      searchInput.addEventListener('input', () => {
        const query   = searchInput.value.toLowerCase().trim();
        const wrapper = document.getElementById('cardapio-wrapper');

        if (!query) {
          // Restaura a aba ativa
          renderCategoria(_categoriaAtiva || Object.keys(
            _todosProdutos.reduce((acc, p) => { if (p.categoria !== 'Destaques') acc[p.categoria] = true; return acc; }, {})
          )[0]);
          return;
        }

        // Busca em todos os produtos
        const encontrados = _todosProdutos.filter(p =>
          p.categoria !== 'Destaques' &&
          (p.nome.toLowerCase().includes(query) ||
           (p.descricao || '').toLowerCase().includes(query))
        );

        if (!encontrados.length) {
          wrapper.innerHTML = `<div class="search-empty">Nenhum produto encontrado para "<strong>${query}</strong>"</div>`;
          return;
        }

        wrapper.innerHTML = `
          <div class="menu-grid" style="padding-top:8px;">
            ${encontrados.map(menuItemHTML).join('')}
          </div>`;
        Cart.bindProductButtons();
      });
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCardapio();
      initSearch();
    });
  </script>

  <script>
    /* ═══ Product Modal ═══ */
    (function () {
      let _product = null;
      let _qty = 1;

      const overlay = document.getElementById('pm-overlay');
      const pmImg   = document.getElementById('pm-img');
      const pmName  = document.getElementById('pm-name');
      const pmDesc  = document.getElementById('pm-desc');
      const pmPrice = document.getElementById('pm-price');
      const pmObs   = document.getElementById('pm-obs');
      const pmQty   = document.getElementById('pm-qty');
      const pmAdd   = document.getElementById('pm-add');

      function openModal(card) {
        _product = {
          id:    card.dataset.productId,
          name:  card.dataset.productName,
          price: parseFloat(card.dataset.productPrice),
          image: card.dataset.productImage || '',
        };
        _qty = 1;
        pmQty.textContent = '1';
        pmObs.value = '';

        pmImg.src = _product.image || 'assets/images/terere-mix.png';
        pmImg.alt = _product.name;
        pmName.textContent  = _product.name;
        const descTxt = card.dataset.productDesc || '';
        pmDesc.textContent  = descTxt;
        pmDesc.style.display = descTxt ? '' : 'none';
        pmPrice.textContent = Number(_product.price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        _product = null;
      }

      // Abre modal ao clicar no card (não no botão +)
      document.addEventListener('click', e => {
        if (e.target.closest('[data-add-to-cart]')) return;
        const card = e.target.closest('[data-product-id]');
        if (!card) return;
        if (card.classList.contains('menu-item--esgotado')) return;
        e.preventDefault();
        openModal(card);
      });

      document.getElementById('pm-close').addEventListener('click', closeModal);
      overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

      document.getElementById('pm-minus').addEventListener('click', () => {
        if (_qty > 1) { _qty--; pmQty.textContent = _qty; }
      });
      document.getElementById('pm-plus').addEventListener('click', () => {
        _qty++;
        pmQty.textContent = _qty;
      });

      pmAdd.addEventListener('click', () => {
        if (!_product) return;
        const obsVal = pmObs.value.trim();
        const items = Cart.getItems();
        const existing = items.find(i => i.id === _product.id && !i.obs && !obsVal);
        if (existing) {
          existing.quantity += _qty;
        } else {
          items.push({ ..._product, quantity: _qty, obs: obsVal });
        }
        Cart.save(items);
        Cart.showToast(`${_product.name} adicionado! 🧉`);
        closeModal();
      });
    })();

    /* ═══ Botões Flutuantes (WhatsApp + Instagram) ═══ */
    (async () => {
      try {
        const empresa = await API.getEmpresa();
        if (!empresa) return;

        if (empresa.whatsapp) {
          const tel = String(empresa.whatsapp).replace(/\D/g, '');
          if (tel) {
            const msg = encodeURIComponent(empresa.mensagem_whatsapp || 'Olá! Vim pelo site da Tereré Mix.');
            const btn = document.getElementById('wpp-float-btn');
            btn.href = `https://wa.me/55${tel}?text=${msg}`;
            btn.style.display = '';
          }
        }

        if (empresa.instagram) {
          const handle = String(empresa.instagram).replace('@', '').trim();
          if (handle) {
            const igBtn = document.getElementById('ig-float-btn');
            igBtn.href = `https://instagram.com/${handle}`;
            igBtn.style.display = '';
          }
        }
      } catch { /* silencioso */ }
    })();
  </script>
</body>
