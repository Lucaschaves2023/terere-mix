<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tereré Mix - Perfil da loja, horário de atendimento e formas de pagamento.">
  <title>Tereré Mix - Perfil da Loja</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#062f23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tereré Mix">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="page-wrapper">

    <!-- ═══ Page Header ═══ -->
    <header class="page-header" id="perfil-header">
      <a href="index.html" class="page-header__back" id="btn-back-perfil" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h1 class="page-header__title">Perfil da loja</h1>
    </header>

    <!-- ═══ Store Header ═══ -->
    <div class="top-header" id="store-header">
      <div class="top-header__brand">
        <img src="assets/images/logotipo.png" alt="Logo Tereré Mix" class="top-header__logo">
        <span class="top-header__title">Tereré Mix</span>
      </div>
      <div class="top-header__actions">
        <button class="top-header__btn" id="btn-share-perfil" aria-label="Compartilhar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- ═══ Store Info ═══ -->
    <div class="store-info" id="perfil-store-info">
      <p class="store-info__details" id="perfil-horario-texto">
        Carregando horário...
      </p>
      <a href="#" class="store-info__link">Perfil da loja</a>
    </div>

    <!-- ═══ Alert Banner ═══ -->
    <div class="alert-banner" id="alert-perfil" role="alert" style="display:none;">
      Loja fechada no momento
    </div>

    <!-- ═══ Horário de Atendimento ═══ -->
    <section aria-label="Horário de atendimento">
      <div class="section-header mt-lg" id="section-horario">Horário de atendimento</div>
      <div class="schedule-list" id="schedule">
        <!-- Preenchido dinamicamente -->
        <div style="padding:1rem;color:var(--color-gray-500);font-size:.85rem;">Carregando horários...</div>
      </div>
    </section>

    <!-- ═══ Formas de Pagamento ═══ -->
    <section aria-label="Formas de pagamento">
      <div class="section-header mt-base" id="section-pagamento-perfil">Formas de pagamento</div>

      <div class="payment-item" id="pay-pix">
        <div class="payment-item__icon payment-item__icon--pix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13.59 2.41a2 2 0 0 0-2.83 0L8.59 4.59l2.83 2.83 2.83-2.83-2.83-2.83L13.59 2.41zM4.59 8.59l-2.18 2.18a2 2 0 0 0 0 2.83l2.18 2.18 2.83-2.83L4.59 8.59zM19.41 8.59l-2.83 2.83 2.83 2.83 2.18-2.18a2 2 0 0 0 0-2.83l-2.18-2.18zM8.59 19.41l2.18 2.18a2 2 0 0 0 2.83 0l2.18-2.18-2.83-2.83-2.83 2.83-1.53-1.53L8.59 19.41z"/>
          </svg>
        </div>
        <span class="payment-item__name">Pix</span>
      </div>

      <div class="payment-item" id="pay-dinheiro">
        <div class="payment-item__icon payment-item__icon--money">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>
        <span class="payment-item__name">Dinheiro</span>
      </div>

      <div class="payment-item" id="pay-cartao">
        <div class="payment-item__icon payment-item__icon--card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
        </div>
        <span class="payment-item__name">Cartão de Débito / Crédito</span>
      </div>
    </section>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal">
      <a href="index.html" class="bottom-nav__item bottom-nav__item--active" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Início</span>
      </a>
      <a href="pedidos.html" class="bottom-nav__item" id="nav-orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Pedidos</span>
      </a>
      <a href="carrinho.html" class="bottom-nav__item" id="nav-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" hidden>0</span>
        <span>Carrinho</span>
      </a>
    </nav>

  </div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script>
    /* ── Compartilhar ── */
    document.getElementById('btn-share-perfil').addEventListener('click', async () => {
      const url  = window.location.origin;
      const data = {
        title: 'Tereré Mix',
        text:  'Tereré, ervas e salgados fresquinhos! Peça pelo cardápio digital 🧉',
        url,
      };
      try {
        if (navigator.share) {
          await navigator.share(data);
        } else {
          await navigator.clipboard.writeText(url);
          showShareToast();
        }
      } catch {
        try { await navigator.clipboard.writeText(url); showShareToast(); } catch {}
      }
    });

    function showShareToast() {
      const t = document.createElement('div');
      t.textContent = 'Link copiado para compartilhar.';
      Object.assign(t.style, {
        position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
        background:'#0B3D2E', color:'#fff', padding:'10px 20px', borderRadius:'8px',
        fontSize:'.85rem', fontWeight:'600', zIndex:'9999', whiteSpace:'nowrap',
        boxShadow:'0 4px 12px rgba(0,0,0,.25)',
      });
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    /* ── Horários dinâmicos ── */
    const NOMES_DIA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

    function parseMins(hhmm) {
      const [h, m] = (hhmm || '00:00').split(':').map(Number);
      return h * 60 + (m || 0);
    }

    function fmtHora(hhmm) {
      return (hhmm || '').replace(':', 'h');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const horarios = await API.getHorarios();
        renderSchedule(horarios);
        renderStatus(horarios);
      } catch {
        document.getElementById('schedule').innerHTML =
          '<div style="padding:1rem;font-size:.85rem;color:var(--color-gray-500);">Horários indisponíveis.</div>';
      }
    });

    function renderSchedule(horarios) {
      const schedule = document.getElementById('schedule');
      const hoje = new Date().getDay();

      schedule.innerHTML = horarios.map(h => {
        const isHoje = h.dia_semana === hoje;
        const hojeStyle = isHoje ? 'font-weight:700;color:var(--color-primary,#0B3D2E);' : '';
        const horaTxt = h.aberto && h.hora_abre && h.hora_fecha
          ? `${fmtHora(h.hora_abre)} às ${fmtHora(h.hora_fecha)}`
          : '<span style="color:var(--color-gray-400);">Fechado</span>';

        return `
          <div class="schedule-item" style="${hojeStyle}">
            <span class="schedule-item__day">${h.nome_dia || NOMES_DIA[h.dia_semana]}:${isHoje ? ' <em style="font-style:normal;font-size:.7rem;color:#1a7a4a;">(hoje)</em>' : ''}</span>
            <span class="schedule-item__time">${horaTxt}</span>
          </div>`;
      }).join('');
    }

    function renderStatus(horarios) {
      const agora     = new Date();
      const diaSemana = agora.getDay();
      const minAtual  = agora.getHours() * 60 + agora.getMinutes();
      const hoje      = horarios.find(h => h.dia_semana === diaSemana);

      const textoEl  = document.getElementById('perfil-horario-texto');
      const alertEl  = document.getElementById('alert-perfil');

      let aberto = false;
      let texto  = '';

      if (hoje && hoje.aberto && hoje.hora_abre && hoje.hora_fecha) {
        const minAbre  = parseMins(hoje.hora_abre);
        const minFecha = parseMins(hoje.hora_fecha);
        if (minAtual >= minAbre && minAtual < minFecha) {
          aberto = true;
          texto  = `Aberto agora até às ${fmtHora(hoje.hora_fecha)}`;
        } else if (minAtual < minAbre) {
          texto = `Abre hoje às ${fmtHora(hoje.hora_abre)}`;
        }
      }

      if (!texto) {
        for (let d = 1; d <= 7; d++) {
          const prox = horarios.find(h => h.dia_semana === (diaSemana + d) % 7);
          if (prox && prox.aberto && prox.hora_abre) {
            texto = `Abre ${d === 1 ? 'amanhã' : (prox.nome_dia || NOMES_DIA[prox.dia_semana])} às ${fmtHora(prox.hora_abre)}`;
            break;
          }
        }
        texto = texto || 'Fechado no momento';
      }

      if (textoEl) {
        textoEl.innerHTML = aberto
          ? `<span style="color:#1a7a4a;font-weight:600;">● Aberto</span> — ${texto} <span>•</span> Pedido mín. R$ 5,00`
          : `<span style="color:#c0392b;">● Fechado</span> — ${texto} <span>•</span> Pedido mín. R$ 5,00`;
      }

      if (alertEl) {
        if (aberto) {
          alertEl.style.display = 'none';
        } else {
          alertEl.textContent = `Loja fechada. ${texto}`;
          alertEl.style.display = '';
        }
      }
    }
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');</script>
</body>
</html>
