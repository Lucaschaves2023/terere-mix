<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Tereré Mix - Seu carrinho de compras. Revise seus itens antes de finalizar o pedido.">
  <title>Tereré Mix - Carrinho</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#062f23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tereré Mix">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
  <div class="page-wrapper" id="cart-page">

    <!-- ═══ Page Header ═══ -->
    <header class="page-header" id="cart-header">
      <a href="index.html" class="page-header__back" id="btn-back-cart" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h1 class="page-header__title">Carrinho</h1>
      <button class="cart-clear-btn" id="btn-clear-cart" aria-label="Limpar carrinho" hidden>Limpar</button>
    </header>

    <!-- ═══ Cart Items (rendered by JS) ═══ -->
    <main id="cart-items-container">
      <!-- Items are injected here -->
    </main>

    <!-- ═══ Cart Summary (shown when items exist) ═══ -->
    <div class="cart-summary" id="cart-summary" hidden>
      <div class="cart-summary__row">
        <span class="cart-summary__label">Subtotal</span>
        <span class="cart-summary__value" id="cart-subtotal">R$ 0,00</span>
      </div>
      <div class="cart-summary__row">
        <span class="cart-summary__label">Entrega</span>
        <span class="cart-summary__value" id="cart-delivery"
          style="color: var(--color-gray-500); font-size: var(--font-size-sm);">Calcular no checkout</span>
      </div>
      <button class="btn btn--primary" id="btn-checkout">Finalizar pedido</button>
    </div>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal">
      <a href="index.html" class="bottom-nav__item" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Início</span>
      </a>
      <a href="pedidos.html" class="bottom-nav__item" id="nav-orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Pedidos</span>
      </a>
      <a href="carrinho.html" class="bottom-nav__item bottom-nav__item--active" id="nav-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" hidden>0</span>
        <span>Carrinho</span>
      </a>
    </nav>

  </div>

  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/services.js"></script>
  <script src="js/checkout.js"></script>
  <script>
    /* ════════════════════════════════════════════
       CART PAGE — Render & Interactions
       ════════════════════════════════════════════ */
    const container = document.getElementById('cart-items-container');
    const summary = document.getElementById('cart-summary');
    const subtotalEl = document.getElementById('cart-subtotal');
    const clearBtn = document.getElementById('btn-clear-cart');
    const checkoutBtn = document.getElementById('btn-checkout');

    function renderCart() {
      const items = Cart.getItems();

      if (items.length === 0) {
        summary.hidden = true;
        clearBtn.hidden = true;
        container.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
            </div>
            <p class="cart-empty__title">Carrinho vazio</p>
            <p class="cart-empty__text">Adicione itens do cardápio para começar seu pedido</p>
            <a href="index.html" class="btn btn--primary">Ver cardápio</a>
          </div>
        `;
        return;
      }

      clearBtn.hidden = false;
      summary.hidden = false;

      container.innerHTML = items.map(item => `
        <div class="cart-item" data-cart-item-id="${item.id}">
          <img src="${item.image || 'assets/images/terere-mix.png'}" alt="${item.name}" class="cart-item__image" loading="lazy">
          <div class="cart-item__info">
            <p class="cart-item__name">${item.name}</p>
            <p class="cart-item__price">${Cart.formatCurrency(item.price * item.quantity)}</p>
          </div>
          <div class="qty-controls">
            <button class="qty-controls__btn ${item.quantity === 1 ? 'qty-controls__btn--danger' : ''}" 
                    data-action="decrease" data-id="${item.id}" 
                    aria-label="Diminuir quantidade">
              ${item.quantity === 1 ? '✕' : '−'}
            </button>
            <span class="qty-controls__count">${item.quantity}</span>
            <button class="qty-controls__btn" 
                    data-action="increase" data-id="${item.id}" 
                    aria-label="Aumentar quantidade">+</button>
          </div>
        </div>
      `).join('');

      subtotalEl.textContent = Cart.formatCurrency(Cart.getSubtotal());
    }

    // Event delegation for quantity buttons
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const id = btn.dataset.id;
      const items = Cart.getItems();
      const item = items.find(i => i.id === id);
      if (!item) return;

      if (btn.dataset.action === 'increase') {
        Cart.setQuantity(id, item.quantity + 1);
      } else {
        Cart.setQuantity(id, item.quantity - 1);
      }
      renderCart();
    });

    // Clear cart
    clearBtn.addEventListener('click', () => {
      if (confirm('Limpar todo o carrinho?')) {
        Cart.clear();
        renderCart();
      }
    });

    // Checkout: handled by checkout.js (modal de finalização)
    // Não sobrescrever aqui — checkout.js registra o evento correto.

    // Listen for cart changes from other tabs
    document.addEventListener('cartChange', renderCart);

    // Initial render
    renderCart();
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');</script>
</body>

</html>
